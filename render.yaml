# Render Blueprint — deploys the Qira backend (FastAPI + Playwright runner).
services:
  - type: web
    name: qira-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: HEADLESS
        value: "true"
      # Run tests on GitHub Actions instead of in this container (see
      # .github/workflows/run-playwright.yml and DEPLOYMENT.md §3).
      - key: TEST_RUNNER
        value: "github-actions"
      # "owner/repo" of this repo on GitHub (hosts the workflow).
      - key: GH_ACTIONS_REPO
        sync: false
      # Fine-grained PAT with Actions read+write on GH_ACTIONS_REPO.
      - key: GH_ACTIONS_TOKEN
        sync: false
      # Set the values below in the Render dashboard (sync: false = never in git).
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_REDIRECT_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
