# Render Blueprint — deploys the Qira backend (FastAPI + Playwright runner).
# Apply via Render Dashboard → Blueprints → New.
services:
  - type: web
    name: qira-backend
    runtime: docker
    # Free works because Chromium no longer runs in this container: test
    # execution is dispatched to GitHub Actions (TEST_RUNNER=github-actions).
    # If you switch TEST_RUNNER back to "local", move to starter or above —
    # browser runs OOM the 512 MB free instance. Free instances also spin down
    # on idle (first request after a pause takes ~a minute).
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Neon connection string (postgresql://... — the backend rewrites it to
      # the asyncpg driver automatically).
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: HEADLESS
        value: "true"
      # Run tests on GitHub Actions instead of in this container (see
      # .github/workflows/run-playwright.yml and DEPLOYMENT.md §3).
      - key: TEST_RUNNER
        value: "github-actions"
      # "owner/repo" of this repo on GitHub (hosts the workflow).
      - key: GH_ACTIONS_REPO
        sync: false
      # Fine-grained PAT with Actions read+write on GH_ACTIONS_REPO.
      - key: GH_ACTIONS_TOKEN
        sync: false
      # Set the values below in the Render dashboard (sync: false = never in git).
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # https://<this-service>.onrender.com/api/auth/github/callback
      - key: GITHUB_REDIRECT_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Comma-separated. The FIRST origin is also where the OAuth callback
      # redirects after login, so put the Vercel domain first, e.g.
      # https://qira.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
