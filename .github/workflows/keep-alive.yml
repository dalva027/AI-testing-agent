name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 min; Render free tier idles out at 15 min
  workflow_dispatch: # manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -sS --fail --max-time 90 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            https://qira-backend.onrender.com/health
